<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hatify">
<meta name="theme-color" content="#0d0d0f">
<title>Hatify</title>
<style>
	:root {
		--bg: #0d0d0f; --panel: #16161a; --line: #2a2a31;
		--text: #f2f2f4; --dim: #9a9aa4; --accent: #4ade80;
		--bad: #f87171; --warn: #fbbf24;
		--bar-h: calc(4.6rem + env(safe-area-inset-bottom));
	}
	* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
	html, body { overscroll-behavior-y: none; }
	body {
		margin: 0; background: var(--bg); color: var(--text);
		font: 16px/1.5 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
		-webkit-font-smoothing: antialiased;
	}
	button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

	/* Controls sit at the BOTTOM: held two-handed in portrait, the top bar is out of
	   thumb reach without a regrip, which is exactly where Spotify puts its own. */
	header {
		position: sticky; top: 0; z-index: 6;
		background: rgba(13,13,15,.9); backdrop-filter: blur(14px);
		border-bottom: 1px solid var(--line);
		padding: max(.5rem, env(safe-area-inset-top)) .8rem .5rem;
		display: flex; align-items: center; gap: .6rem;
	}
	header h1 { font-size: 1.05rem; margin: 0; letter-spacing: -.02em; flex: 1; }
	header .count { font-size: .78rem; color: var(--dim); font-variant-numeric: tabular-nums; }
	.pill {
		font-size: .8rem; padding: .35rem .7rem; border-radius: 999px;
		border: 1px solid var(--line); color: var(--dim); white-space: nowrap;
	}
	.pill[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }

	#sorts, #kinds { display: flex; gap: .4rem; overflow-x: auto; padding: .5rem .8rem; scrollbar-width: none; }
	#sorts { padding-top: 0; }
	#sorts::-webkit-scrollbar, #kinds::-webkit-scrollbar { display: none; }

	#shelf { padding: 0 .8rem var(--bar-h); }

	/* Grid: covers only, no names — he knows his own records by looking at them.
	   3 up in portrait puts a cover at roughly 49mm, about double Spotify's linear
	   size, which is the actual complaint being answered. */
	.section-head {
		/* Below the app bar, not under it. */
		position: sticky; top: calc(2.6rem + env(safe-area-inset-top)); z-index: 4;
		background: linear-gradient(var(--bg) 70%, transparent);
		padding: 1.1rem 0 .5rem; font-size: .8rem; font-weight: 700;
		letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
	}
	/* Cover size is Harry's to set, not mine to guess at. auto-fill means the count
	   falls out of the screen width instead of being hardcoded per orientation. */
	.view-grid { --cover: 300px; }
	.view-grid[data-size="s"] { --cover: 150px; }
	.view-grid[data-size="m"] { --cover: 220px; }
	.view-grid[data-size="l"] { --cover: 300px; }
	.view-grid[data-size="xl"] { --cover: 440px; }
	.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--cover), 46vw), 1fr)); gap: .7rem; }
	.grid .rec { border-radius: 6px; overflow: hidden; }
	.grid .rec img, .grid .rec .ph { width: 100%; aspect-ratio: 1; display: block; object-fit: cover; }

	.list .rec { display: flex; gap: .8rem; align-items: center; padding: .45rem 0; text-align: left; width: 100%; }
	.list .rec img, .list .rec .ph { width: 62px; height: 62px; border-radius: 5px; flex: none; object-fit: cover; }
	.list .meta { min-width: 0; }
	.list .nm { font-weight: 600; font-size: .92rem; }
	.list .ar { color: var(--dim); font-size: .82rem; }
	.list .nm, .list .ar { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	/* Placeholder while the cover is out of view or still loading. Keeping the box
	   the same size means nothing reflows and he never loses his place. */
	.ph { background: var(--line); }

	#status {
		position: fixed; left: .8rem; right: .8rem; bottom: calc(var(--bar-h) + .6rem); z-index: 25;
		background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
		padding: .6rem .8rem; font-size: .85rem; display: none;
	}
	#status.on { display: block; }
	#status.bad { border-color: var(--bad); }
	#status.warn { border-color: var(--warn); }
	#status button { color: var(--accent); font-weight: 600; margin-left: .5rem; }

	#bar {
		position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
		background: rgba(22,22,26,.97); backdrop-filter: blur(14px);
		border-top: 1px solid var(--line);
		padding: .6rem .8rem calc(.6rem + env(safe-area-inset-bottom));
		display: none; align-items: center; gap: .7rem;
	}
	#bar.on { display: flex; }
	#bar img { width: 44px; height: 44px; border-radius: 5px; background: var(--line); }
	#bar .meta { flex: 1; min-width: 0; }
	#bar .t { font-weight: 600; font-size: .88rem; }
	#bar .a { color: var(--dim); font-size: .78rem; }
	#bar .t, #bar .a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	/* Transport keys, not phone icons. Squared-off, slightly proud of the deck, with
	   a lit top edge and a shadow under — the feel of a tape deck's piano keys. */
	.key {
		width: 46px; height: 38px; border-radius: 4px; flex: none;
		background: linear-gradient(#3a3a42, #232329);
		border: 1px solid #4a4a54; border-top-color: #6a6a76;
		box-shadow: 0 2px 0 #101014, inset 0 1px 0 rgba(255,255,255,.16);
		display: grid; place-items: center; padding: 0;
		transition: transform .06s, box-shadow .06s;
	}
	.key:active { transform: translateY(2px); box-shadow: 0 0 0 #101014, inset 0 1px 3px rgba(0,0,0,.5); }
	.key svg { width: 17px; height: 17px; fill: #e8e8ec; }
	.key.play { width: 56px; }
	.key.play svg { fill: var(--accent); }

	/* Peek: hold a cover to pull it out of the sleeve, release to drop it back.
	   Answers "I want them bigger" without a detail screen, a back button, or
	   losing your place in 688 records. */
	#peek {
		position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.86);
		display: none; flex-direction: column; align-items: center; justify-content: center;
		padding: 1.5rem; gap: 1rem;
	}
	#peek.on { display: flex; }
	#peek img { width: min(78vw, 78vh); aspect-ratio: 1; object-fit: cover; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.7); }
	#peek .info { text-align: center; }
	#peek .pn { font-size: 1.1rem; font-weight: 600; }
	#peek .pa { color: var(--dim); }

	#welcome { padding: 2.5rem 1.2rem; text-align: center; }
	#welcome h2 { font-size: 1.4rem; margin: 0 0 .5rem; }
	#welcome p { color: var(--dim); margin: 0 0 1.4rem; }
	#connect { background: var(--accent); color: #0d0d0f; font-weight: 600; padding: .85rem 1.3rem; border-radius: 10px; }

	#fab {
		position: fixed; right: .8rem; bottom: calc(var(--bar-h) + .6rem); z-index: 20;
		width: 50px; height: 50px; border-radius: 50%; font-size: 1.35rem;
		background: var(--panel); border: 1px solid var(--line);
		box-shadow: 0 4px 16px rgba(0,0,0,.5);
	}
	#report[hidden] { display: none; }
	#report { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
	#report .sheet {
		background: var(--panel); width: 100%; max-width: 34rem; border-radius: 16px 16px 0 0;
		border-top: 1px solid var(--line); padding: 1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));
		max-height: 88vh; overflow-y: auto;
	}
	#report h2 { font-size: 1.05rem; margin: 0 0 .4rem; }
	#report .sub { color: var(--dim); font-size: .88rem; margin: 0 0 .7rem; }
	#report textarea {
		width: 100%; min-height: 6.5rem; background: var(--bg); color: var(--text);
		border: 1px solid var(--line); border-radius: 10px; padding: .7rem; font: inherit; resize: vertical;
	}
	#report .row { display: flex; gap: .5rem; margin-top: .8rem; flex-wrap: wrap; }
	#report .row button { padding: .7rem 1.1rem; border-radius: 10px; border: 1px solid var(--line); }
	#report #reportSend { background: var(--accent); color: #0d0d0f; font-weight: 600; border-color: var(--accent); }
	#report details { margin-top: 1rem; border-top: 1px solid var(--line); padding-top: .8rem; }
	#report summary { color: var(--dim); font-size: .88rem; }
	#report input[type=tel] { width: 100%; margin-top: .6rem; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: .7rem; font: inherit; }
	.ctx { font-size: .74rem; color: var(--dim); margin-top: .5rem; }
	#saved { margin-top: 1rem; font-size: .84rem; color: var(--dim); }
	#saved > div { padding: .4rem 0; border-top: 1px solid var(--line); }
	button.mini { font-size: .74rem; padding: .22rem .5rem; color: var(--accent); border: 1px solid var(--line); border-radius: 6px; }

	#settings[hidden], #album[hidden] { display: none; }
	#settings, #album { position: fixed; inset: 0; z-index: 35; background: rgba(0,0,0,.65); display: flex; align-items: flex-end; justify-content: center; }
	#settings .sheet, #album .sheet {
		background: var(--panel); width: 100%; max-width: 40rem; border-radius: 16px 16px 0 0;
		border-top: 1px solid var(--line); padding: 1.1rem 1.1rem calc(1.1rem + env(safe-area-inset-bottom));
		max-height: 90vh; overflow-y: auto;
	}
	#settings h2 { font-size: 1.05rem; margin: 0 0 .8rem; }
	.setting { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .6rem 0; border-bottom: 1px solid var(--line); }
	.setting input[type=range] { flex: 1; max-width: 60%; accent-color: var(--accent); }
	#settings .row { display: flex; gap: .5rem; margin-top: 1rem; flex-wrap: wrap; }
	#settings .row button { padding: .7rem 1.1rem; border-radius: 10px; border: 1px solid var(--line); }
	#settingsClose { background: var(--accent); color: #0d0d0f; font-weight: 600; border-color: var(--accent) !important; }
	.sub { color: var(--dim); font-size: .85rem; }

	#albumHead { display: flex; gap: 1rem; align-items: flex-start; margin: .9rem 0 1rem; }
	#albumHead img { width: 168px; height: 168px; border-radius: 6px; flex: none; background: var(--line); }
	#albumHead h3 { margin: 0 0 .2rem; font-size: 1.15rem; }
	#albumHead .who { color: var(--dim); }
	#albumHead .facts { color: var(--dim); font-size: .84rem; margin-top: .4rem; }
	#albumHead button.playall {
		margin-top: .8rem; background: var(--accent); color: #0d0d0f; font-weight: 600;
		padding: .55rem 1rem; border-radius: 999px;
	}
	#versions { margin-bottom: .8rem; display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
	#versions .lbl { color: var(--dim); font-size: .8rem; width: 100%; }
	.trk { display: flex; gap: .8rem; align-items: center; padding: .55rem 0; border-top: 1px solid var(--line); width: 100%; text-align: left; }
	.trk .no { color: var(--dim); font-size: .8rem; width: 1.6rem; flex: none; font-variant-numeric: tabular-nums; }
	.trk .tn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.trk .dur { color: var(--dim); font-size: .8rem; font-variant-numeric: tabular-nums; }
	.trk[aria-current="true"] .tn { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<header>
	<h1>Hatify</h1>
	<span class="count" id="count"></span>
	<button class="pill" id="sizeToggle">Size</button>
	<button class="pill" id="viewToggle" aria-pressed="false">List</button>
	<button class="pill" id="settingsBtn" aria-label="Settings">⚙</button>
</header>
<div id="kinds" hidden></div>
<div id="sorts" hidden></div>

<div id="welcome">
	<h2>Your records</h2>
	<p>Everything you've saved, as covers you can actually see.</p>
	<button id="connect">Connect Spotify</button>
</div>

<div id="shelf"></div>

<div id="status"></div>

<div id="bar">
	<img id="barArt" alt="">
	<div class="meta"><div class="t" id="barTitle">—</div><div class="a" id="barArtist"></div></div>
	<button class="key" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h3v14H6zM20 5v14L9.5 12z"/></svg></button>
	<button class="key play" id="toggle" aria-label="Play or pause"><svg viewBox="0 0 24 24" id="toggleIcon"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
	<button class="key" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M15 5h3v14h-3zM4 5v14l10.5-7z"/></svg></button>
</div>

<div id="peek"><img id="peekArt" alt=""><div class="info"><div class="pn" id="peekName"></div><div class="pa" id="peekArtist"></div></div></div>

<div id="settings" hidden><div class="sheet">
	<h2>Settings</h2>
	<label class="setting">Volume <input type="range" id="vol" min="0" max="100"></label>
	<div class="setting"><span>Shuffle</span> <button class="pill" id="shuffleBtn" aria-pressed="false">Off</button></div>
	<div class="setting"><span>Repeat</span> <button class="pill" id="repeatBtn">Off</button></div>
	<p class="sub" id="eqNote"></p>
	<div class="row">
		<button id="settingsClose">Done</button>
		<button id="refetch">Reload my records</button>
	</div>
</div></div>

<div id="album" hidden><div class="sheet">
	<button id="albumBack" class="pill">‹ Back</button>
	<div id="albumHead"></div>
	<div id="versions"></div>
	<div id="tracks"></div>
	<p class="sub" id="albumNote"></p>
</div></div>

<button id="fab" title="Tell Dad what's broken or rubbish">💬</button>

<div id="report" hidden>
	<div class="sheet">
		<h2>Tell Dad</h2>
		<p class="sub" id="reportIntro"></p>
		<textarea id="reportText" placeholder="What's broken, wrong, or just annoying?"></textarea>
		<div class="ctx" id="reportCtx"></div>
		<div class="row">
			<button id="reportSend">Send</button>
			<button id="reportClose">Not now</button>
		</div>
		<div id="saved"></div>
		<details>
			<summary>Direct-to-Dad setup</summary>
			<p class="sub" style="margin:.6rem 0 0">Put Dad's mobile number in once and Send opens Messages straight to him. It stays on this device.</p>
			<input type="tel" id="reportPhone" placeholder="e.g. +61 4XX XXX XXX" autocomplete="tel">
			<div class="row"><button id="reportSavePhone">Save number</button></div>
		</details>
	</div>
</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
/*
 * Hatify — the whole record shelf.
 *
 * Harry has 688 saved albums. Waiting for roughly fourteen Spotify requests
 * before drawing anything made a working app look broken, so the old shelf is
 * deliberately returned before the new one is fetched. A cached shelf says it
 * is stale because, at that instant, nobody yet knows whether Spotify changed.
 *
 * The first playback proof also threw Spotify's refresh token away. The access
 * token then expired after an hour and the app stopped without an explanation.
 * This owns the return from Spotify so the refresh token is saved the first time;
 * do not run the old handleReturn() before loadLibrary() when integrating it.
 */
(function () {
	'use strict';

	const CLIENT_ID = 'bbe6ec90fa9b4ff29d44a47b35d8bcb3';
	const TOKEN_URL = 'https://accounts.spotify.com/api/token';
	const API_ORIGIN = 'https://api.spotify.com';
	const FIRST_PAGE = API_ORIGIN + '/v1/me/albums?limit=50';

	// Every app on themikemonday.github.io gets the same browser storage. The
	// database, store, record and existing login keys all name Hatify explicitly.
	const K = {
		token: 'hatify.token',
		verifier: 'hatify.pkce',
		database: 'hatify.library',
		store: 'hatify.library.records',
		// v2 adds album_type. A v1 cache has no type on it, so bumping the key makes
		// existing installs refetch once rather than showing an unfilterable shelf.
		albums: 'hatify.saved-albums.v2'
	};

	const REFRESH_EARLY_MS = 60000;
	const MAX_RATE_LIMIT_RETRIES = 4;
	let databasePromise = null;
	let refreshPromise = null;
	let authorizationPromise = null;

	function failure(code, message, details = {}) {
		const error = new Error(message);
		error.name = 'HatifyLibraryError';
		error.code = code;
		Object.assign(error, details);
		return error;
	}

	function mustLogIn(message) {
		return failure('must_log_in_again', message, {
			state: 'must_log_in_again',
			requiresLogin: true
		});
	}

	function reportFailure(error) {
		// A background failure cannot change a Promise that already painted the
		// shelf. Keep it visible in Safari's console instead of losing it silently.
		const code = error?.code || 'unexpected_failure';
		console.warn(`[Hatify library: ${code}] ${error?.message || error}`, error);
	}

	function notify(callback, value, name) {
		if (typeof callback !== 'function') return;
		try {
			const result = callback(value);
			if (result && typeof result.catch === 'function') {
				result.catch((error) => reportFailure(failure(
					`${name}_callback_failed`,
					`Hatify's ${name} callback failed: ${error?.message || error}`,
					{ cause: error }
				)));
			}
		} catch (error) {
			reportFailure(failure(
				`${name}_callback_failed`,
				`Hatify's ${name} callback failed: ${error?.message || error}`,
				{ cause: error }
			));
		}
	}

	function requestResult(request, code, message) {
		return new Promise((resolve, reject) => {
			request.onsuccess = () => resolve(request.result);
			request.onerror = () => reject(failure(code, message, { cause: request.error }));
		});
	}

	function openDatabase() {
		if (databasePromise) return databasePromise;
		if (!globalThis.indexedDB) {
			return Promise.reject(failure(
				'cache_unavailable',
				'This browser does not provide IndexedDB, so Hatify cannot keep an offline shelf.'
			));
		}

		databasePromise = new Promise((resolve, reject) => {
			let request;
			try { request = indexedDB.open(K.database, 1); }
			catch (error) {
				reject(failure('cache_unavailable', 'Hatify could not open its album cache.', { cause: error }));
				return;
			}

			request.onupgradeneeded = () => {
				if (!request.result.objectStoreNames.contains(K.store)) {
					request.result.createObjectStore(K.store);
				}
			};
			request.onsuccess = () => {
				const database = request.result;
				database.onversionchange = () => {
					// Another Hatify tab may have opened a newer cache. Closing this copy
					// lets that upgrade finish instead of leaving both tabs stuck.
					database.close();
					databasePromise = null;
				};
				resolve(database);
			};
			request.onerror = () => {
				databasePromise = null;
				reject(failure('cache_unavailable', 'Hatify could not open its album cache.', { cause: request.error }));
			};
			request.onblocked = () => {
				databasePromise = null;
				reject(failure('cache_blocked', 'Another Hatify tab is blocking the album cache. Close the other tab and try again.'));
			};
		});

		return databasePromise;
	}

	async function readCache() {
		const database = await openDatabase();
		let request;
		try {
			request = database.transaction(K.store, 'readonly').objectStore(K.store).get(K.albums);
		} catch (error) {
			throw failure('cache_read_failed', 'Hatify could not read its saved shelf.', { cause: error });
		}
		const albums = await requestResult(request, 'cache_read_failed', 'Hatify could not read its saved shelf.');
		if (albums === undefined) return null;
		if (!Array.isArray(albums)) {
			throw failure('cache_corrupt', 'Hatify found an album cache it cannot understand.');
		}
		return albums;
	}

	async function writeCache(albums) {
		const database = await openDatabase();
		let transaction, request;
		try {
			transaction = database.transaction(K.store, 'readwrite');
			request = transaction.objectStore(K.store).put(albums, K.albums);
		} catch (error) {
			throw failure('cache_write_failed', 'Hatify loaded the shelf but could not save it for next time.', { cause: error });
		}
		await requestResult(request, 'cache_write_failed', 'Hatify loaded the shelf but could not save it for next time.');
		// put() reports success before the transaction commits, and running out of
		// storage surfaces at commit time. Waiting only on the request would call a
		// shelf saved that was actually thrown away, which is discovered later as an
		// empty app with no network.
		await new Promise((resolve, reject) => {
			transaction.oncomplete = () => resolve();
			transaction.onabort = transaction.onerror = () => reject(failure(
				'cache_write_failed',
				'Hatify loaded the shelf but could not save it for next time.',
				{ cause: transaction.error }
			));
		});
	}

	async function clearLibraryCache() {
		const database = await openDatabase();
		let request;
		try {
			request = database.transaction(K.store, 'readwrite').objectStore(K.store).delete(K.albums);
		} catch (error) {
			throw failure('cache_clear_failed', 'Hatify could not clear its saved shelf.', { cause: error });
		}
		await requestResult(request, 'cache_clear_failed', 'Hatify could not clear its saved shelf.');
	}

	function readStoredToken() {
		let raw;
		try { raw = localStorage.getItem(K.token); }
		catch (error) {
			throw failure('token_storage_unavailable', 'This browser would not let Hatify read the Spotify login.', { cause: error });
		}
		if (!raw) return null;

		let token;
		try { token = JSON.parse(raw); }
		catch (error) {
			throw failure('token_record_invalid', 'Hatify found a Spotify login it cannot understand. Log in again.', {
				state: 'must_log_in_again', requiresLogin: true, cause: error
			});
		}
		if (!token || typeof token.access !== 'string' || !token.access) {
			throw failure('token_record_invalid', 'Hatify found a Spotify login it cannot understand. Log in again.', {
				state: 'must_log_in_again', requiresLogin: true
			});
		}
		return token;
	}

	function saveToken(token) {
		try { localStorage.setItem(K.token, JSON.stringify(token)); }
		catch (error) {
			// Continuing here would recreate the original one-hour failure, only
			// with a different cause. Refuse the false success instead.
			throw failure('token_storage_unavailable', 'Spotify logged in, but this browser would not let Hatify save the login.', { cause: error });
		}
	}

	function forgetToken() {
		try { localStorage.removeItem(K.token); }
		catch (error) {
			throw failure('token_storage_unavailable', 'Spotify rejected the login, but Hatify could not remove the broken token.', {
				state: 'must_log_in_again', requiresLogin: true, cause: error
			});
		}
	}

	// Only discard the login if it is still the one that just failed. Spotify rotates
	// refresh tokens, so with the app open in Safari and on the Home Screen at once,
	// the slower tab refreshes a token the faster tab has already replaced, is told
	// invalid_grant, and would otherwise delete a working login out from under it.
	function forgetTokenIfUnchanged(attempted) {
		let current = null;
		try { current = readStoredToken(); } catch { forgetToken(); return; }
		if (!current || current.refresh === attempted?.refresh) forgetToken();
	}

	function retryDelay(response) {
		const value = response.headers.get('Retry-After');
		const seconds = Number(value);
		if (Number.isFinite(seconds) && seconds >= 0) return Math.max(1000, seconds * 1000);
		const date = Date.parse(value);
		if (Number.isFinite(date)) return Math.max(1000, date - Date.now());
		return 1000;
	}

	const wait = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

	async function fetchWithRateLimit(url, options = {}) {
		for (let attempt = 0; ; attempt++) {
			let response;
			try { response = await fetch(url, options); }
			catch (error) {
				throw failure('offline', 'Hatify could not reach Spotify. The device may be offline.', { cause: error });
			}

			if (response.status !== 429) return response;
			const delay = retryDelay(response);
			if (attempt >= MAX_RATE_LIMIT_RETRIES) {
				throw failure('rate_limited', 'Spotify is still asking Hatify to slow down. Try again later.', {
					retryAfter: delay
				});
			}
			// Retry-After is Spotify telling us exactly when another request is
			// welcome. Guessing sooner only makes the lockout last longer.
			await wait(delay);

		try { return await response.json(); }
		catch (error) { throw failure(code, message, { status: response.status, cause: error }); }
	}

	function cleanAuthorizationURL() {
		const url = new URL(location.href);
		url.searchParams.delete('code');
		url.searchParams.delete('error');
		url.searchParams.delete('error_description');
		url.searchParams.delete('state');

		const url = new URL(location.href);

			cleanAuthorizationURL();
			throw mustLogIn(`Spotify refused the login (${denied}). Log in again.`);
		}

		const code = url.searchParams.get('code');
		if (!code) return;

		let verifier;
		try { verifier = sessionStorage.getItem(K.verifier); }
		catch (error) {
			throw failure('pkce_storage_unavailable', 'Hatify could not read the one-time Spotify login verifier.', { cause: error });
		}
		if (!verifier) {
			cleanAuthorizationURL();
			throw mustLogIn('Hatify lost the one-time Spotify login verifier. Start the login again.');
		}

		const response = await fetchWithRateLimit(TOKEN_URL, {
			method: 'POST',
			headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
			body: new URLSearchParams({
				grant_type: 'authorization_code',
				code,
				redirect_uri: location.origin + location.pathname,
				client_id: CLIENT_ID,
				code_verifier: verifier
			})
		});

		if (!response.ok) {
			if (data?.error === 'invalid_grant' || response.status === 401) {
				cleanAuthorizationURL();
				throw mustLogIn('Spotify rejected the one-time login code. Start the login again.');
			}
			throw failure('token_exchange_failed', `Spotify could not finish the login (${response.status}).`, {
				status: response.status, spotifyError: data?.error || null
			});
		}
		if (!data?.access_token || !data?.refresh_token || !Number.isFinite(Number(data.expires_in))) {
			cleanAuthorizationURL();
			throw failure('token_response_invalid', 'Spotify logged in without returning the tokens Hatify needs. Start the login again.', {
				state: 'must_log_in_again', requiresLogin: true
			});
		}

		saveToken({
			access: data.access_token,
			refresh: data.refresh_token,
			expires: Date.now() + Number(data.expires_in) * 1000
		});

	}

	function captureAuthorizationReturn() {
		if (authorizationPromise) return authorizationPromise;
		authorizationPromise = exchangeAuthorizationCode().finally(() => { authorizationPromise = null; });
		return authorizationPromise;
	}

	async function forceRefreshAccessToken(token) {
		if (!token?.refresh) return null;

		const response = await fetchWithRateLimit(TOKEN_URL, {
			method: 'POST',
			headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
			body: new URLSearchParams({
				grant_type: 'refresh_token',
				refresh_token: token.refresh,
				client_id: CLIENT_ID
			})
		});

		if (!response.ok) {
			if (data?.error === 'invalid_grant' || data?.error === 'invalid_client' || response.status === 401) {
				forgetTokenIfUnchanged(token);

			}
			throw failure('token_refresh_failed', `Spotify could not refresh the login (${response.status}).`, {
				status: response.status, spotifyError: data?.error || null
			});

			throw failure('token_response_invalid', 'Spotify refreshed the login without returning a usable access token.');
		}

		const fresh = {
			access: data.access_token,
			// Spotify usually sends a refresh token only when it rotates one. Losing
			// the old value when it omits that field would break the next refresh.
			refresh: data.refresh_token || token.refresh,
			expires: Date.now() + Number(data.expires_in) * 1000
		};

		return fresh.access;
	}

	async function refreshAccessToken() {
		const token = readStoredToken();
		if (!token) return null;
		if (Number.isFinite(Number(token.expires)) && Date.now() < Number(token.expires) - REFRESH_EARLY_MS) {
			return token.access;
		}
		if (!token.refresh) return null;

		if (!refreshPromise) {
			refreshPromise = forceRefreshAccessToken(token).finally(() => { refreshPromise = null; });
		}
		return refreshPromise;
	}

	async function refreshAfter401() {
		const token = readStoredToken();
		if (!token?.refresh) return null;
		if (!refreshPromise) {
			refreshPromise = forceRefreshAccessToken(token).finally(() => { refreshPromise = null; });
		}
		return refreshPromise;
	}

	async function spotifyRequest(url) {
		let access = await refreshAccessToken();
		if (!access) throw mustLogIn('Spotify needs Harry to log in again.');

		let response = await fetchWithRateLimit(url, {
			headers: { Authorization: 'Bearer ' + access }
		});
		if (response.status !== 401) return response;

		access = await refreshAfter401();
		if (!access) throw mustLogIn('Spotify rejected the saved login. Harry must log in again.');
		response = await fetchWithRateLimit(url, {
			headers: { Authorization: 'Bearer ' + access }
		});
		if (response.status === 401) {
			forgetToken();
			throw mustLogIn('Spotify rejected the refreshed login. Harry must log in again.');
		}
		return response;
	}

	function normalizeAlbum(item, position) {
		const album = item?.album;
		const valid = album
			&& typeof album.id === 'string'
			&& typeof album.name === 'string'
			&& Array.isArray(album.artists)
			&& album.artists.every((artist) => typeof artist?.name === 'string')
			&& Array.isArray(album.images)
			&& album.images.every((image) => typeof image?.url === 'string')
			&& typeof album.release_date === 'string'
			&& Number.isFinite(album.total_tracks)
			&& typeof item.added_at === 'string'
			&& typeof album.uri === 'string';
		// Skip, do not throw. Throwing meant one odd record out of 688 lost Harry the
		// entire shelf, and Spotify's catalogue is not uniformly clean: albums go
		// regionally unavailable, get delisted, and occasionally come back with a
		// null album or no artwork. Losing one record is a footnote; losing the
		// collection because of it is the app being broken.
		if (!valid) {
			reportFailure(failure(
				'album_skipped',
				`Skipped an incomplete album at shelf position ${position + 1}.`,
				{ id: album?.id ?? null, name: album?.name ?? null }
			));
			return null;
		}

		return {
			id: album.id,
			name: album.name,
			artists: album.artists.map((artist) => artist.name),
			images: album.images.map((image) => ({
				url: image.url,
				width: Number.isFinite(image.width) ? image.width : null,
				height: Number.isFinite(image.height) ? image.height : null
			})),
			release_date: album.release_date,
			total_tracks: album.total_tracks,
			added_at: item.added_at,
			uri: album.uri,
			// Not required above: an album missing this is still a perfectly good
			// record, and losing it over a filter field would be absurd.
			album_type: typeof album.album_type === 'string' ? album.album_type : 'album'
		};
	}

	async function fetchAllAlbums(onProgress) {
		let next = FIRST_PAGE;
		let total = null;
		let skipped = 0;
		const albums = [];

		while (next) {
			let pageURL;
			try { pageURL = new URL(next); }
			catch (error) {
				throw failure('spotify_response_invalid', 'Spotify returned an invalid next-page address.', { cause: error });
			}
			if (pageURL.origin !== API_ORIGIN) {
				// The bearer token must never follow a server-provided link away from
				// Spotify, even if a bad response somehow supplies one.
				throw failure('spotify_response_invalid', 'Spotify returned a next-page address outside Spotify.');
			}

			const response = await spotifyRequest(pageURL.href);
			if (!response.ok) {
				throw failure('spotify_request_failed', `Spotify could not load the album shelf (${response.status}).`, {
					status: response.status, url: pageURL.href
				});
			}
			const page = await responseJSON(response, 'spotify_response_invalid', 'Spotify returned an unreadable album page.');
			if (!Array.isArray(page?.items) || !Number.isFinite(page.total) || !(page.next === null || typeof page.next === 'string')) {
				throw failure('spotify_response_invalid', 'Spotify returned an album page Hatify cannot understand.');
			}

			for (const item of page.items) {
				const album = normalizeAlbum(item, albums.length + skipped);
				if (album) albums.push(album); else skipped++;
			}
			total = Math.max(total ?? 0, page.total, albums.length);
			notify(onProgress, { loaded: albums.length, total, skipped }, 'progress');
			next = page.next;
		}

		return { albums, skipped };
	}

	const shelvesMatch = (cached, fresh) => JSON.stringify(cached) === JSON.stringify(fresh);

	async function fetchAndCache(onProgress) {
		await captureAuthorizationReturn();
		const { albums, skipped } = await fetchAllAlbums(onProgress);
		// Whether the shelf actually reached the cache is the caller's business: a
		// load that fetched fine but failed to save looks perfect now and looks like
		// an empty app the next time he opens it without a signal.
		let cached = true;
		try { await writeCache(albums); }
		catch (error) { cached = false; reportFailure(error); }
		return { albums, skipped, cached };
	}

	async function loadLibrary(options = {}) {
		if (!options || typeof options !== 'object') {
			throw failure('invalid_options', 'loadLibrary expects an options object.');
		}
		const { onProgress, onFresh, onError } = options;
		const openingURL = new URL(location.href);
		if (openingURL.searchParams.has('code') || openingURL.searchParams.has('error')) {
			// A normal reopen still paints straight from cache. A return from Spotify
			// is different: losing this one-time code would force another trip through
			// login, so save its refresh token before handing control back to the UI.
			await captureAuthorizationReturn();
		}
		let cached = null;
		try { cached = await readCache(); }
		catch (error) {
			reportFailure(error);
			if (error.code === 'cache_corrupt') clearLibraryCache().catch(reportFailure);
		}

		if (cached !== null) {
			// Do not await this. The whole point of the cache is that fourteen page
			// requests cannot hold the shelf hostage when Hatify opens.
			fetchAndCache(onProgress).then(({ albums: fresh, skipped, cached: saved }) => {
				if (!shelvesMatch(cached, fresh)) notify(onFresh, { albums: fresh, skipped, cached: saved }, 'fresh');
			}).catch((error) => {
				reportFailure(error);
				// The console is not a place a fifteen-year-old looks. A background
				// refresh that fails because the login died is the exact case where he
				// is looking at a cached shelf whose records will not play, so the UI
				// has to be told rather than left to discover it on a 401.
				notify(onError, error, 'error');
			});
			return { albums: cached, fromCache: true, stale: true };
		}

		const { albums, skipped, cached: saved } = await fetchAndCache(onProgress);
		return { albums, fromCache: false, stale: false, skipped, cached: saved };
	}

	globalThis.loadLibrary = loadLibrary;
	globalThis.refreshAccessToken = refreshAccessToken;
	globalThis.clearLibraryCache = clearLibraryCache;
})();

<script>
/*
 * Hatify — Harry's record collection.
 *
 * Built for one 15-year-old with 688 saved albums who navigates by cover art and
 * wanted them bigger. Plays inside the page: handing off to the Spotify app was
 * ruled out, and the Web Playback SDK was proved on his iPad on 2026-08-04.
 *
 * Nothing here generates or infers anything about music. Every fact shown comes
 * from Spotify and is his own. That is the point of the app, not a detail of it.
 */
const CLIENT_ID = 'bbe6ec90fa9b4ff29d44a47b35d8bcb3';
const REDIRECT = location.origin + location.pathname;
const SCOPES = [
	'streaming', 'user-read-email', 'user-read-private',
	'user-read-playback-state', 'user-modify-playback-state', 'user-library-read'
].join(' ');
const K = { verifier: 'hatify.pkce', token: 'hatify.token', view: 'hatify.view', sort: 'hatify.sort', size: 'hatify.size', kind: 'hatify.kind', notes: 'hatify.notes', phone: 'hatify.phone' };
const SIZES = ['s', 'm', 'l', 'xl'];
const SIZE_LABEL = { s: 'Small', m: 'Medium', l: 'Big', xl: 'Huge' };

const el = (id) => document.getElementById(id);
const readLS = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } };
const writeLS = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

let albums = [], view = readLS(K.view, 'grid'), sortKey = readLS(K.sort, 'artist'), size = readLS(K.size, 'l');
let kindFilter = readLS(K.kind, 'all'), shown = 0;
let player = null, deviceId = null, sdkReady = false, nowPlaying = null;
const trail = [];   // recent events, for the reporter's context and the console

function note(msg, kind = '') {
	trail.push(`${new Date().toTimeString().slice(0, 8)} ${msg}`);
	if (trail.length > 60) trail.shift();
	if (kind === 'bad') console.warn('[Hatify]', msg); else console.log('[Hatify]', msg);
}

let statusTimer = null;
function status(msg, kind = '', action = null) {
	const s = el('status');
	note(msg, kind);
	s.className = 'on ' + kind;
	s.textContent = msg;
	if (action) {
		const b = document.createElement('button');
		b.textContent = action.label;
		b.onclick = action.run;
		s.append(b);
	}
	clearTimeout(statusTimer);
	// Errors stay until dealt with. Anything else is a passing remark.
	if (kind !== 'bad') statusTimer = setTimeout(() => s.classList.remove('on'), 4000);
}
const clearStatus = () => { clearTimeout(statusTimer); el('status').classList.remove('on'); };

/* ---------- Login ---------- */

const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

async function login() {
	const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
	const verifier = Array.from(crypto.getRandomValues(new Uint8Array(96)), (b) => chars[b % chars.length]).join('');
	try { sessionStorage.setItem(K.verifier, verifier); }
	catch { status('This device will not let Hatify start a login.', 'bad'); return; }
	const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
	location.assign('https://accounts.spotify.com/authorize?' + new URLSearchParams({
		response_type: 'code', client_id: CLIENT_ID, scope: SCOPES,
		redirect_uri: REDIRECT, code_challenge_method: 'S256', code_challenge: challenge
	}));
}

// The library module owns the return from Spotify — it is the only place that saves
// the refresh token. A second handler here would consume the one-time code first and
// throw that token away, which is the bug that killed the app after an hour.
function hasStoredLogin() {
	try { return !!JSON.parse(localStorage.getItem(K.token) || 'null')?.access; } catch { return false; }
}
function needsLogin(why) {
	albums = [];
	el('welcome').style.display = '';
	el('shelf').innerHTML = '';
	el('sorts').hidden = true;
	el('count').textContent = '';
	status(why, 'bad', { label: 'Log in', run: login });
}

/* ---------- Arranging 688 records ---------- */

const strip = (s) => s.replace(/^(the|a|an)\s+/i, '').trim();
const year = (a) => parseInt(a.release_date.slice(0, 4), 10) || 0;
const artistOf = (a) => a.artists[0] || 'Unknown';

const SORTS = {
	// 688 albums is roughly 250 artists, and 250 is a browsable number. That
	// collapse is the whole trick, and unlike save-date it does not depend on
	// Spotify's dates being honest about the early years.
	artist: {
		label: 'Artist',
		compare: (a, b) => strip(artistOf(a)).localeCompare(strip(artistOf(b)), 'en', { sensitivity: 'base' })
			|| year(a) - year(b),   // a discography in release order reads as an era-line
		section: (a) => { const c = strip(artistOf(a))[0]?.toUpperCase() || '#'; return /[A-Z]/.test(c) ? c : '#'; }
	},
	added: {
		label: 'Recently saved',
		compare: (a, b) => (a.added_at < b.added_at ? 1 : a.added_at > b.added_at ? -1 : 0),
		section: (a) => new Date(a.added_at).toLocaleDateString('en-AU', { month: 'long', year: 'numeric' })
	},
	decade: {
		label: 'Decade',
		compare: (a, b) => year(b) - year(a) || strip(artistOf(a)).localeCompare(strip(artistOf(b))),
		section: (a) => (year(a) ? `${Math.floor(year(a) / 10) * 10}s` : 'No year')
	}
};

/* Spotify has no EP type. An EP arrives tagged "single" with several tracks on it,
   so the split is by track count — the same call a shop makes putting a 5-track
   12" in the EP rack rather than the singles bin. */
function kindOf(a) {
	if (a.album_type === 'single') return a.total_tracks >= 4 ? 'ep' : 'single';
	return 'album';
}
const KINDS = { all: 'Everything', album: 'Albums', ep: 'EPs', single: 'Singles' };

function arrange() {
	const s = SORTS[sortKey] || SORTS.artist;
	const pool = kindFilter === 'all' ? albums : albums.filter((a) => kindOf(a) === kindFilter);
	// One cover per record. Harry has A Love Supreme three times over — original,
	// mono and deluxe — and three identical sleeves in a row is clutter, not a
	// collection. The plainest title stands for the record; the rest live inside it.
	const one = new Map();
	for (const a of pool) {
		const key = recordKey(a);
		const held = one.get(key);
		if (!held || a.name.length < held.name.length) one.set(key, a);
	}
	const sorted = [...one.values()].sort(s.compare);
	shown = sorted.length;
	const groups = [];
	for (const album of sorted) {
		const name = s.section(album);
		if (!groups.length || groups[groups.length - 1].name !== name) groups.push({ name, items: [] });
		groups[groups.length - 1].items.push(album);
	}
	return groups;
}

/* ---------- The shelf ----------
   688 covers at full size decode to over a gigabyte, which is a guaranteed Safari
   kill. So the tiles all exist — 688 empty boxes are cheap and keep scrolling and
   scroll position honest — but an image is only attached while it is near the
   screen, and detached again once it is not. */

const nearScreen = new IntersectionObserver((entries) => {
	for (const e of entries) {
		const box = e.target;
		if (e.isIntersecting) attachCover(box);
		else detachCover(box);
	}
}, { rootMargin: '600px 0px' });

function attachCover(box) {
	if (box.dataset.loaded === '1') return;
	const a = albums[+box.dataset.i];
	if (!a) return;
	const img = document.createElement('img');
	img.alt = '';
	img.decoding = 'async';
	img.src = coverURL(a, view === 'grid' ? 640 : 300);
	img.onerror = () => { img.replaceWith(placeholder()); };
	box.firstChild?.replaceWith(img);
	box.dataset.loaded = '1';
}
function detachCover(box) {
	if (box.dataset.loaded !== '1') return;
	box.firstChild?.replaceWith(placeholder());
	box.dataset.loaded = '0';
}
const placeholder = () => { const d = document.createElement('div'); d.className = 'ph'; return d; };

function coverURL(a, want) {
	// Spotify serves roughly 640 / 300 / 64. Take the smallest that is still at
	// least what is being asked for, so a list row does not pull a 640px file.
	const sized = a.images.filter((i) => i.width).sort((x, y) => x.width - y.width);
	return (sized.find((i) => i.width >= want) || sized[sized.length - 1] || a.images[0] || {}).url || '';
}

function renderShelf() {
	const shelf = el('shelf');
	nearScreen.disconnect();
	shelf.innerHTML = '';
	// NOT `view` — that put class "grid" on the shelf itself, so the shelf became a
	// 4-column grid and laid the section headings and the inner grids out as its own
	// cells, side by side. Shipped 2026-08-04 and obvious the moment anyone looked.
	shelf.className = 'view-' + view;
	shelf.dataset.size = size;
	const index = new Map(albums.map((a, i) => [a.id, i]));

	for (const group of arrange()) {
		const h = document.createElement('div');
		h.className = 'section-head';
		h.textContent = `${group.name}  ·  ${group.items.length}`;
		shelf.append(h);

		const wrap = document.createElement('div');
		wrap.className = view === 'grid' ? 'grid' : 'list';
		for (const a of group.items) {
			const b = document.createElement('button');
			b.className = 'rec';
			b.dataset.i = index.get(a.id);
			b.dataset.loaded = '0';
			b.append(placeholder());
			if (view === 'list') {
				const m = document.createElement('div');
				m.className = 'meta';
				m.innerHTML = `<div class="nm"></div><div class="ar"></div>`;
				m.querySelector('.nm').textContent = a.name;
				m.querySelector('.ar').textContent = `${a.artists.join(', ')}${year(a) ? ' · ' + year(a) : ''}`;
				b.append(m);
			}
			bindRecord(b, a);
			wrap.append(b);
			nearScreen.observe(b);
		}
		shelf.append(wrap);
	}
	el('count').textContent = shown === albums.length ? `${albums.length}` : `${shown} of ${albums.length}`;
}

/* Tap opens the record — Harry asked for the tracklist, and it is also where the
   different pressings of the same album live. Hold still peeks the cover big. */
function bindRecord(button, album) {
	let timer = null, held = false;
	const start = () => { held = false; timer = setTimeout(() => { held = true; showPeek(album); }, 300); };
	const end = (e) => {
		clearTimeout(timer);
		if (held) { hidePeek(); e.preventDefault(); return; }
		openAlbum(album);
	};
	button.addEventListener('touchstart', start, { passive: true });
	button.addEventListener('touchend', end);
	button.addEventListener('touchcancel', () => { clearTimeout(timer); hidePeek(); });
	button.addEventListener('mousedown', start);
	button.addEventListener('mouseup', end);
	button.addEventListener('mouseleave', () => { clearTimeout(timer); if (held) hidePeek(); });
}
function showPeek(a) {
	el('peekArt').src = coverURL(a, 640);
	el('peekName').textContent = a.name;
	el('peekArtist').textContent = `${a.artists.join(', ')}${year(a) ? ' · ' + year(a) : ''} · ${a.total_tracks} tracks`;
	el('peek').classList.add('on');
}
const hidePeek = () => el('peek').classList.remove('on');

/* ---------- The record ----------
   Harry: "There are doubles of some albums (e.g. a love supreme) because I have
   the monophonic edition saved as well." So the shelf shows one cover per record
   and the pressings sit inside it. Matching is on title plus artist with the
   edition wording stripped — deliberately conservative, because wrongly merging
   two genuinely different records is worse than leaving a duplicate on the shelf. */

const EDITION = /\s*[\(\[\-–—]?\s*\b(mono(phonic)?|stereo|deluxe( edition)?|expanded( edition)?|remaster(ed)?|anniversary|reissue|special edition|super deluxe|\d{4} (remaster|mix|version)|bonus track version|explicit)\b[^\)\]]*[\)\]]?\s*/gi;
const recordKey = (a) => (a.name.replace(EDITION, ' ').replace(/\s+/g, ' ').trim().toLowerCase()
	+ '|' + a.artists.join(',').toLowerCase());

function versionsOf(album) {
	const key = recordKey(album);
	// Longest title last: the plain pressing reads first, the deluxe after it.
	return albums.filter((a) => recordKey(a) === key).sort((a, b) => a.name.length - b.name.length);
}

const mmss = (ms) => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

let openRecord = null;
async function openAlbum(album) {
	openRecord = album;
	el('album').hidden = false;
	el('albumNote').textContent = '';
	paintAlbumHead(album);
	el('tracks').innerHTML = '<p class="sub">Getting the tracklist...</p>';
	paintVersions(album);
	try {
		const full = await api(`/albums/${album.id}`);
		if (openRecord?.id !== album.id) return;   // he moved on while it loaded
		paintAlbumHead(album, full);
		paintTracks(album, full);
	} catch (e) {
		if (e.message !== 'login required') el('tracks').innerHTML = '<p class="sub">Could not get the tracklist. Check the connection and try again.</p>';
	}
}

function paintAlbumHead(a, full) {
	const label = full?.label ? ` · ${full.label}` : '';
	el('albumHead').innerHTML = '';
	const img = document.createElement('img');
	img.src = coverURL(a, 640); img.alt = '';
	const box = document.createElement('div');
	const h = document.createElement('h3'); h.textContent = a.name;
	const who = document.createElement('div'); who.className = 'who'; who.textContent = a.artists.join(', ');
	const facts = document.createElement('div'); facts.className = 'facts';
	facts.textContent = `${year(a) || '—'} · ${a.total_tracks} tracks${label} · ${KINDS[kindOf(a)] || ''}`.replace(' · Albums', '');
	const play = document.createElement('button'); play.className = 'playall'; play.textContent = '▶ Play';
	play.onclick = () => playRecord(a);
	box.append(h, who, facts, play);
	el('albumHead').append(img, box);
}

function paintVersions(album) {
	const all = versionsOf(album);
	const box = el('versions');
	box.innerHTML = '';
	if (all.length < 2) return;
	const lbl = document.createElement('div');
	lbl.className = 'lbl';
	lbl.textContent = `You have ${all.length} pressings of this`;
	box.append(lbl);
	for (const v of all) {
		const b = document.createElement('button');
		b.className = 'pill';
		// The distinguishing words are what the shelf strips out; show those.
		const edition = v.name.replace(album.name.replace(EDITION, ' ').replace(/\s+/g, ' ').trim(), '').trim();
		b.textContent = (edition.replace(/^[\(\[\-–—\s]+|[\)\]\s]+$/g, '') || 'Original') + ` · ${v.total_tracks}`;
		b.setAttribute('aria-pressed', String(v.id === album.id));
		b.onclick = () => openAlbum(v);
		box.append(b);
	}
}

function paintTracks(a, full) {
	const box = el('tracks');
	box.innerHTML = '';
	for (const t of full.tracks?.items || []) {
		const row = document.createElement('button');
		row.className = 'trk';
		const no = document.createElement('span'); no.className = 'no'; no.textContent = t.track_number;
		const nm = document.createElement('span'); nm.className = 'tn'; nm.textContent = t.name;
		const du = document.createElement('span'); du.className = 'dur'; du.textContent = mmss(t.duration_ms);
		row.append(no, nm, du);
		row.onclick = () => playRecord(a, t.uri);
		box.append(row);
	}
	el('albumNote').textContent = 'Credits and liner notes are coming next — from Discogs and Wikipedia, so every line says where it came from.';
}

/* ---------- Playback ---------- */

async function api(path, opts = {}) {
	const access = await refreshAccessToken();
	if (!access) { needsLogin('Your Spotify login has run out. Tap to log in again.'); throw new Error('login required'); }
	const res = await fetch('https://api.spotify.com/v1' + path, {
		...opts, headers: { Authorization: 'Bearer ' + access, 'Content-Type': 'application/json', ...opts.headers }
	});
	if (!res.ok && res.status !== 204) throw new Error(String(res.status));
	return res.status === 204 ? null : res.headers.get('content-type')?.includes('json') ? res.json() : null;
}

async function playRecord(album, trackUri) {
	if (!deviceId) {
		if (!player && sdkReady) { status('Starting the player...'); startPlayer(); }
		else status('Player is still starting — try again in a moment.', 'warn');
		return;
	}
	try {
		if (player.activateElement) await player.activateElement();   // iOS needs the tap
		const body = { context_uri: album.uri };
		// Starting at a track still plays the record from there on, rather than
		// firing off one track on its own.
		if (trackUri) body.offset = { uri: trackUri };
		await api(`/me/player/play?device_id=${deviceId}`, { method: 'PUT', body: JSON.stringify(body) });
		clearStatus();
	} catch (e) {
		if (e.message === '403') status('Playing needs Spotify Premium on this account.', 'bad');
		else if (e.message !== 'login required') status(`Could not play that (${e.message}).`, 'bad');
	}
}

window.onSpotifyWebPlaybackSDKReady = () => { sdkReady = true; if (hasStoredLogin()) startPlayer(); };

function startPlayer() {
	if (!sdkReady || player) return;
	player = new Spotify.Player({
		name: 'Hatify',
		getOAuthToken: (cb) => { refreshAccessToken().then((t) => { if (t) cb(t); }).catch(() => {}); },
		volume: 0.8
	});
	player.addListener('ready', ({ device_id }) => { deviceId = device_id; note('player ready'); });
	player.addListener('not_ready', () => { deviceId = null; note('player offline'); });
	player.addListener('initialization_error', ({ message }) => status(`Could not start the player: ${message}`, 'bad'));
	player.addListener('authentication_error', () => needsLogin('Spotify would not accept the login. Tap to log in again.'));
	player.addListener('account_error', () => status('Playing in the app needs Spotify Premium.', 'bad'));
	player.addListener('playback_error', ({ message }) => status(`Playback problem: ${message}`, 'warn'));

	player.addListener('player_state_changed', (state) => {
		if (!state) { el('bar').classList.remove('on'); nowPlaying = null; return; }
		const tr = state.track_window.current_track;
		nowPlaying = `${tr.name} — ${tr.artists.map((a) => a.name).join(', ')}`;
		el('bar').classList.add('on');
		el('barArt').src = tr.album.images[0]?.url || '';
		el('barTitle').textContent = tr.name;
		el('barArtist').textContent = tr.artists.map((a) => a.name).join(', ');
		// Swap the path, not the button's text — the button holds an SVG key face.
		el('toggleIcon').innerHTML = state.paused
			? '<path d="M8 5v14l11-7z"/>'
			: '<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>';
		shuffleOn = !!state.shuffle;
		repeatMode = REPEATS[state.repeat_mode] || 'off';
		/* The lock screen will say "Spotify embedded player", not the record. The SDK
		   plays inside a cross-origin iframe and iOS reads Now Playing from whatever
		   element is actually playing, which is Spotify's. There is no bridge for it —
		   asked for since 2018. Mike saw this on 2026-08-04. Setting it anyway costs
		   nothing and is correct the day Spotify ships one. */
		if ('mediaSession' in navigator) {
			navigator.mediaSession.metadata = new MediaMetadata({
				title: tr.name, artist: tr.artists.map((a) => a.name).join(', '), album: tr.album.name,
				artwork: tr.album.images.map((i) => ({ src: i.url, sizes: `${i.width}x${i.height}`, type: 'image/jpeg' }))
			});
		}
	});
	connectPlayer(0);
}

function connectPlayer(attempt) {
	player.connect().then((ok) => {
		if (ok) return;
		if (attempt < 3) setTimeout(() => connectPlayer(attempt + 1), 2 ** attempt * 1000);
		else {
			// A single failed connect used to be permanent: player was already set, so
			// startPlayer() returned early forever and every tap said "no player".
			status('Could not reach Spotify. Tap a record to try again.', 'bad');
			player = null; deviceId = null;
		}
	});
}

/* ---------- Reporter ---------- */

const APP_VERSION = 'v1';
const readJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
let notes = readJSON(K.notes, []);
let dadPhone = readLS(K.phone, '');

const reportContext = () => [
	APP_VERSION, navigator.standalone ? 'Home Screen' : 'Safari',
	`${albums.length} albums`, `${view}/${sortKey}`,
	nowPlaying ? `playing ${nowPlaying}` : 'nothing playing'
].join(' · ');

const isAppleTouch = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// iOS wants sms:NUMBER&body=, everything else wants ?body=. Wrong separator opens
// Messages empty, which reads as the app having eaten what he wrote.
const smsUrl = (phone, msg) => 'sms:' + phone.replace(/[^\d+]/g, '') + (isAppleTouch() ? '&' : '?') + 'body=' + encodeURIComponent(msg);
const noteMessage = (n) => `🎧 Hatify\n\n${n.text}\n\n— ${n.context}`;

// Returns whether it was actually handed off. Telling him it reached Dad when it
// did not is the one failure that would stop him bothering to report again.
async function sendReport(msg) {
	if (dadPhone) { location.href = smsUrl(dadPhone, msg); return true; }
	if (navigator.share) {
		try { await navigator.share({ text: msg }); return true; }
		catch (e) { if (e.name === 'AbortError') return false; }
	}
	location.href = 'mailto:mm@mikemonday.com?subject=' + encodeURIComponent('Hatify') + '&body=' + encodeURIComponent(msg);
	return true;
}

function renderReport() {
	el('reportIntro').textContent = dadPhone
		? `Type it like a text — Send opens Messages straight to Dad (…${dadPhone.replace(/\D/g, '').slice(-4)}), and a copy stays here.`
		: 'Type it like a text message. It saves here first so it can\'t get lost, then sends to Dad.';
	el('reportCtx').textContent = reportContext();
	el('reportPhone').value = dadPhone;
	const recent = notes.slice(-5).reverse();
	el('saved').innerHTML = recent.length ? `<b>Saved notes (${notes.length})</b>` : '';
	for (const n of recent) {
		const d = document.createElement('div');
		d.textContent = `${n.when.slice(0, 10)} — ${n.text.length > 70 ? n.text.slice(0, 70) + '…' : n.text} `;
		const b = document.createElement('button');
		b.className = 'mini'; b.textContent = '↗ send again';
		b.onclick = () => sendReport(noteMessage(n));
		d.append(b);
		el('saved').append(d);
	}
}

/* ---------- Wiring ---------- */

el('connect').onclick = login;
el('toggle').onclick = () => player?.togglePlay();
el('next').onclick = () => player?.nextTrack();
el('prev').onclick = () => player?.previousTrack();
el('peek').onclick = hidePeek;

function paintSizeToggle() {
	el('sizeToggle').textContent = SIZE_LABEL[size];
	el('sizeToggle').hidden = view !== 'grid';
}
el('sizeToggle').onclick = () => {
	size = SIZES[(SIZES.indexOf(size) + 1) % SIZES.length];
	writeLS(K.size, size);
	paintSizeToggle();
	el('shelf').dataset.size = size;   // CSS variable does the rest; no re-render needed
};

el('viewToggle').onclick = () => {
	view = view === 'grid' ? 'list' : 'grid';
	writeLS(K.view, view);
	el('viewToggle').textContent = view === 'grid' ? 'List' : 'Covers';
	el('viewToggle').setAttribute('aria-pressed', String(view === 'list'));
	paintSizeToggle();
	renderShelf();
};

function pillRow(box, entries, current, choose) {
	box.innerHTML = '';
	for (const [key, label] of entries) {
		const b = document.createElement('button');
		b.className = 'pill';
		b.textContent = label;
		b.setAttribute('aria-pressed', String(key === current));
		b.onclick = () => { choose(key); window.scrollTo(0, 0); };
		box.append(b);
	}
	box.hidden = false;
}

function renderSorts() {
	pillRow(el('sorts'), Object.entries(SORTS).map(([k, s]) => [k, s.label]), sortKey,
		(k) => { sortKey = k; writeLS(K.sort, k); renderSorts(); renderShelf(); });
}

function renderKinds() {
	// Counts on the pills, because "Singles · 0" is a fact worth seeing rather than
	// an empty screen that looks like a bug.
	const n = { album: 0, ep: 0, single: 0 };
	for (const a of albums) n[kindOf(a)]++;
	const entries = Object.entries(KINDS).map(([k, label]) =>
		[k, k === 'all' ? `${label} · ${albums.length}` : `${label} · ${n[k]}`]);
	pillRow(el('kinds'), entries, kindFilter,
		(k) => { kindFilter = k; writeLS(K.kind, k); renderKinds(); renderShelf(); });
}

/* Settings. Volume, shuffle and repeat are real: Spotify exposes them. An EQ is
   not, and saying so beats drawing sliders that move nothing — the audio plays
   inside Spotify's own sealed frame, which no web page can reach into. */
let shuffleOn = false, repeatMode = 'off';
const REPEATS = ['off', 'context', 'track'];
const REPEAT_LABEL = { off: 'Off', context: 'Whole record', track: 'One track' };

function paintSettings() {
	el('shuffleBtn').textContent = shuffleOn ? 'On' : 'Off';
	el('shuffleBtn').setAttribute('aria-pressed', String(shuffleOn));
	el('repeatBtn').textContent = REPEAT_LABEL[repeatMode];
	el('repeatBtn').setAttribute('aria-pressed', String(repeatMode !== 'off'));
	el('eqNote').textContent = 'There is no EQ here, and there cannot be one: Spotify plays the sound inside its own sealed player and nothing on this page can reach it. Your iPad\'s own EQ, or the one on your headphones, is the real answer.';
}
el('settingsBtn').onclick = () => { paintSettings(); el('settings').hidden = false; };
el('settingsClose').onclick = () => { el('settings').hidden = true; };
el('settings').onclick = (e) => { if (e.target === el('settings')) el('settings').hidden = true; };
el('vol').oninput = (e) => { player?.setVolume(e.target.value / 100).catch(() => {}); };
el('shuffleBtn').onclick = async () => {
	shuffleOn = !shuffleOn;
	try { await api(`/me/player/shuffle?state=${shuffleOn}&device_id=${deviceId}`, { method: 'PUT' }); }
	catch { shuffleOn = !shuffleOn; status('Could not change shuffle.', 'warn'); }
	paintSettings();
};
el('repeatBtn').onclick = async () => {
	const was = repeatMode;
	repeatMode = REPEATS[(REPEATS.indexOf(repeatMode) + 1) % REPEATS.length];
	try { await api(`/me/player/repeat?state=${repeatMode}&device_id=${deviceId}`, { method: 'PUT' }); }
	catch { repeatMode = was; status('Could not change repeat.', 'warn'); }
	paintSettings();
};
el('refetch').onclick = async () => {
	el('settings').hidden = true;
	try { await clearLibraryCache(); } catch {}
	location.reload();
};

const closeAlbum = () => { el('album').hidden = true; openRecord = null; };
el('albumBack').onclick = closeAlbum;
el('album').onclick = (e) => { if (e.target === el('album')) closeAlbum(); };

el('fab').onclick = () => { renderReport(); el('report').hidden = false; el('reportText').focus(); };
el('reportClose').onclick = () => { el('report').hidden = true; };
el('report').onclick = (e) => { if (e.target === el('report')) el('report').hidden = true; };
el('reportSavePhone').onclick = () => {
	dadPhone = el('reportPhone').value.trim();
	writeLS(K.phone, dadPhone);
	renderReport();
	el('reportSavePhone').textContent = 'Saved';
	setTimeout(() => { el('reportSavePhone').textContent = 'Save number'; }, 2000);
};
el('reportSend').onclick = async () => {
	const text = el('reportText').value.trim();
	if (!text) { el('reportText').focus(); return; }
	// Save before sending: a cancelled share sheet must not lose what he typed.
	const n = { text, context: reportContext(), when: new Date().toISOString() };
	notes.push(n);
	try { localStorage.setItem(K.notes, JSON.stringify(notes)); }
	catch { status('No room left on this device to save the note — sending it anyway.', 'warn'); }
	el('reportText').value = '';
	el('report').hidden = true;
	const handed = await sendReport(noteMessage(n));
	status(handed ? 'Sent to Dad.' : 'Saved. Tap 💬 and "send again" whenever you want.', handed ? '' : 'warn');
};

/* ---------- Start ---------- */

function showLibrary(list) {
	albums = list;
	el('welcome').style.display = 'none';
	renderKinds();
	renderSorts();
	renderShelf();
}

(async function start() {
	el('viewToggle').textContent = view === 'grid' ? 'List' : 'Covers';
	el('viewToggle').setAttribute('aria-pressed', String(view === 'list'));
	paintSizeToggle();

	const returning = new URL(location.href).searchParams.has('code') || new URL(location.href).searchParams.has('error');
	if (!returning && !hasStoredLogin()) return;   // first run: the welcome screen stands

	el('welcome').style.display = 'none';
	status('Getting your records...');
	try {
		const res = await loadLibrary({
			onProgress: ({ loaded, total }) => { el('count').textContent = total ? `${loaded} / ${total}` : `${loaded}`; },
			onFresh: ({ albums: fresh, skipped }) => {
				showLibrary(fresh);
				status(`Shelf updated${skipped ? ` · ${skipped} album${skipped > 1 ? 's' : ''} Spotify could not give us` : ''}.`);
			},
			onError: (e) => {
				if (e?.state === 'must_log_in_again') needsLogin('Your Spotify login has run out. Tap to log in again.');
				else status('Could not check for new records — showing the ones already here.', 'warn');
			}
		});
		showLibrary(res.albums);
		if (res.cached === false) status('Loaded, but this device had no room to remember the shelf.', 'warn');
		else clearStatus();
		if (sdkReady) startPlayer();
	} catch (e) {
		if (e?.state === 'must_log_in_again' || e?.requiresLogin) {
			// Anyone already carrying a login from the playback test has no refresh
			// token in it, so it cannot be renewed. Send him straight at the button
			// rather than leaving him on an app that just looks broken.
			needsLogin('Spotify needs you to log in again.');
		} else if (e?.code === 'offline') {
			status('No connection, and nothing saved on this device yet.', 'bad', { label: 'Try again', run: () => location.reload() });
		} else {
			status(`Could not load your records: ${e?.message || e}`, 'bad', { label: 'Try again', run: () => location.reload() });
		}
	}
})();
</script>
